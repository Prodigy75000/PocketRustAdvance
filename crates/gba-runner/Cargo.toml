[package]
name = "gba-runner"
version = "0.1.0"
edition = "2021"

# Dev harnesses. `tomharte` is the CPU conformance runner and comes first — it
# is how we grind the ARM7TDMI to green before any window exists. The minifb
# window / png `shot` / wav `rec` bins mirror the GB runner and land later.
[[bin]]
name = "tomharte"
path = "src/tomharte.rs"

[[bin]]
name = "gba"
path = "src/gba.rs"

[[bin]]
name = "sweep"
path = "src/sweep.rs"

[dependencies]
gba-core = { path = "../gba-core" }
png = "0.17"
